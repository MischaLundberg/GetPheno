[Default]
stam_file = /path/to/stamdata.csv
; File order only determines the order of per-file column mappings.
lpr_file = /path/to/psyk_adm.csv,/path/to/lpr_adm.csv
; File order only determines the order of per-file column mappings.
; lpr2nd_file = /path/to/psyk_diag.csv,/path/to/lpr_diag.csv
lpr_cols_to_read_as_date = fdato,d_inddto,d_uddto
stam_cols_to_read_as_date = fdato,statd,fdato_m,fdato_f,statd_m,statd_f
diagnostic_col = c_adiag
; Register/source column: shared name or one name per lpr_file entry.
; Blank auto-detects register, then source, when presets or --PSYK/--LPR need it.
registercol =
; With multiple lpr_file entries, use either one shared column or one per file,
; for example: diagnostic_col = diagnosis,code
pheno_requestcol = diagnosis
birthdatecol = fdato
; Optional death date in -i or any -j file. Blank values mean no recorded death.
; In iPSYCH mode, a recorded death before the first birthday excludes the IID.
deathdatecol =
; Inclusive completed age-at-death range; 0,0 disables this filter.
MinMaxAgeDeath = 0,0
; With an active age-at-death range, also retain IIDs without a recorded death.
keepAlive = False
; Retain only IIDs with a recorded death; may be combined with MinMaxAgeDeath.
onlyDead = False
iidcol = pnr
fsep = ,
gsep = ,
opholdsep = \t
input_date_in_name = d_inddto
input_date_out_name = d_uddto
; The same one-name-or-one-per-file rule applies to iidcol, input_date_in_name,
; input_date_out_name, DiagTypecol, registercol, and lpr_recnummer.
general_exclusions = 
DateFormat = %%d/%%m/%%Y
remove_point_in_diag_request = True
remove_ICD_naming = True
; lpr_recnummer = k_recnum
; lpr2nd_recnummer = v_recnum
diagnostic2nd_col = c_diag
sexcol = kqn
; Filter rows by case-insensitive LPR or PSYK/PSYC substring in registercol:
runLPRonly = False
runPSYKonly = False
addition_information_file = 
ophold_file = 
processed_ophold_file = /path/to/processed_ophold.csv
DiagTypeExclusions = H,M
lowmem = False
; batchsize = 10000
; Optional OMOP CDM cohort-result export. The two input files are required when enabled.
write_omop_cohort = False
; omop_person_map = /protected/path/iid_to_person.tsv
; omop_person_map_iid_col = pnr
omop_person_id_col = person_id
; omop_cohort_definitions = /path/omop_cohorts.tsv
; omop_output_dir = /path/results/run.omop
omopsep = \t
